// ── Helpers ───────────────────────────────────────────────────────────────────

function getTierIndex(qty, tiers) {
  let idx = 0;
  for (let i = tiers.length - 1; i >= 0; i--) {
    if (qty >= tiers[i]) { idx = i; break; }
  }
  return idx;
}

function formatCurrency(val) {
  return "$" + val.toFixed(2);
}

// Get the right table for a location (handles patches specially)
function getLocationTable(serviceKey, location, isFirst) {
  const service = SERVICES[serviceKey];
  if (service.isPatches) {
    const patchTypeIdx = location.patchTypeIdx || 0;
    const pt = service.patchTypes[patchTypeIdx];
    return {
      options: pt.sizes,
      prices: pt.prices,
      markup: isFirst ? service.markup : service.markupZero,
      qtyTiers: service.qtyTiers,
    };
  }
  const table = isFirst ? service.firstLocation : service.additionalLocation;
  return { ...table, qtyTiers: QTY_TIERS };
}

function LocationCard({ index, location, onChange, onRemove, qty }) {
  const isFirst = index === 0;
  const serviceKey = location.serviceKey;
  const service = SERVICES[serviceKey];

  };

  const handlePatchTypeChange = (idx) => {
    onChange({ ...location, patchTypeIdx: idx, optionIdx: 0 });
  };

  const patchTypeIdx = location.patchTypeIdx || 0;

  // Check if qty is below minimum patch tier
  const belowPatchMin = isPatches && (qty || 1) < PATCH_QTY_TIERS[0];

  return (
    <div style={{
      background: isFirst ? "linear-gradient(135deg, #1a1f2e 0%, #0f1319 100%)" : "#111318",

function AutoPricer() {
  const [productPrice, setProductPrice] = useState("");
  const [qty, setQty] = useState("");
  const [locations, setLocations] = useState([{ serviceKey: "screenPrint", optionIdx: 0, patchTypeIdx: 0 }]);

  const addLocation = useCallback(() => {
    if (locations.length < 4) setLocations(prev => [...prev, { serviceKey: "screenPrint", optionIdx: 0, patchTypeIdx: 0 }]);
  }, [locations.length]);

  const removeLocation = useCallback((idx) => {
    setLocations(prev => prev.filter((_, i) => i !== idx));
  }, []);

  const updateLocation = useCallback((idx, val) => {
    setLocations(prev => prev.map((l, i) => i === idx ? val : l));
  }, []);

  const pricing = useMemo(() => {
    const price = parseFloat(productPrice);
    const quantity = parseInt(qty);
    if (!price || !quantity || quantity < 1) return null;

    // Product markup comes from the FIRST location's service
    const firstService = SERVICES[locations[0].serviceKey];
    let markup;
    if (firstService.isPatches) {
      const patchTierIdx = getTierIndex(quantity, PATCH_QTY_TIERS);
      markup = firstService.markup[patchTierIdx];
    } else {
      const tierIdx = getTierIndex(quantity, QTY_TIERS);
      markup = firstService.firstLocation.markup[tierIdx];
    }
    // Store has a $5.00 minimum product markup
    const STORE_MIN_MARKUP = 5.00;
    const isStoreFirst = locations[0].serviceKey === "store";
    const markedUpProduct = isStoreFirst
      ? Math.max(price * markup, price + STORE_MIN_MARKUP)
      : price * markup;

    let totalDecoPerUnit = 0;
    const locationBreakdown = locations.map((loc, i) => {
      const service = SERVICES[loc.serviceKey];
      const isFirst = i === 0;
      const table = getLocationTable(loc.serviceKey, loc, isFirst);
      const tierIdx = getTierIndex(quantity, table.qtyTiers);
      const optIdx = loc.optionIdx < table.options.length ? loc.optionIdx : 0;
      const decoPrice = table.prices[tierIdx]?.[optIdx] ?? 0;
      totalDecoPerUnit += decoPrice;

      let labelDetail = table.options[optIdx];
      if (service.isPatches) {
        const ptIdx = loc.patchTypeIdx || 0;
        labelDetail = `${service.patchTypes[ptIdx].label} ${labelDetail}`;
      }

      return {
        label: labelDetail,
        serviceName: service.label,
        decoPrice,
        isFirst,
        isUnavailable: decoPrice >= 100 && loc.serviceKey === "screenPrint",
      };
    });

    const unitPrice = markedUpProduct + totalDecoPerUnit;
    const totalPrice = unitPrice * quantity;

    // Track if store minimum markup was applied
    const storeMinApplied = isStoreFirst && (price * markup) < (price + STORE_MIN_MARKUP);

    // Determine tier label from first location
    const firstTable = getLocationTable(locations[0].serviceKey, locations[0], true);
    const firstTierIdx = getTierIndex(quantity, firstTable.qtyTiers);
    const tierLabel = `${firstTable.qtyTiers[firstTierIdx]}+ tier`;

    return {
      markedUpProduct,
      markup,
      storeMinApplied,
      totalDecoPerUnit,
      unitPrice,
      totalPrice,
      quantity,
      locationBreakdown,
      tierLabel,
    };
  }, [productPrice, qty, locations]);

  return (
    <>
      <link href={FONT_URL} rel="stylesheet" />
      <div style={{
        minHeight: "100vh",
        background: "#08090c",
        fontFamily: "'DM Sans', sans-serif",
        color: "#e5e7eb",
        padding: "32px 16px",
      }}>
        <div style={{ maxWidth: 920, margin: "0 auto" }}>
          {/* Header */}
          <div style={{ marginBottom: 36, textAlign: "center" }}>
            <div style={{
              display: "inline-block",
              background: "linear-gradient(135deg, #3b82f6, #8b5cf6)",
              WebkitBackgroundClip: "text",
              WebkitTextFillColor: "transparent",
              fontSize: 11,
              fontWeight: 700,
              letterSpacing: "0.15em",
              textTransform: "uppercase",
              marginBottom: 8,
              fontFamily: "'JetBrains Mono', monospace",
            }}>
              PTVO AUTO PRICER
            </div>
            <h1 style={{
              fontSize: 32,
              fontWeight: 700,
              color: "#f9fafb",
              margin: "4px 0 8px",
              letterSpacing: "-0.02em",
            }}>
              Instant Decoration Pricing
            </h1>
            <p style={{ color: "#6b7280", fontSize: 14, margin: 0 }}>
              Enter product details and imprint locations to generate pricing
            </p>
            <a href="../" style={{
              display: "inline-block",
              marginTop: 16,
              color: "#6b7280",
              fontSize: 13,
              fontWeight: 600,
              textDecoration: "none",
            }}>
              ← Projects
            </a>
          </div>

          <div className="pricer-grid">
            {/* LEFT: Inputs */}
            <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
              {/* Product Price + Qty */}
              <div style={{
                background: "#0f1117",
                border: "1px solid #1e2330",
                borderRadius: 16,
                padding: 22,
                display: "flex",
                gap: 16,
              }}>
                <div style={{ flex: 1 }}>
                  <label style={{ display: "block", color: "#9ca3af", fontSize: 12, fontWeight: 500, letterSpacing: "0.04em", marginBottom: 8 }}>
                    PRODUCT COST
                  </label>
                  <div style={{ position: "relative" }}>
                    <span style={{
                      position: "absolute", left: 12, top: "50%", transform: "translateY(-50%)",
                      color: "#4b5563", fontSize: 16, fontWeight: 600, pointerEvents: "none",
                    }}>$</span>
                    <input
                      className="pricer-input"
                      type="number"
                      inputMode="decimal"
                      placeholder="0.00"
                      value={productPrice}
                      onChange={e => setProductPrice(e.target.value)}
                      step="0.01"
                      min="0"
                      style={{
                        width: "100%",
                        background: "#0a0d12",
                        border: "1px solid #1e2330",
                        borderRadius: 8,
                        color: "#f9fafb",
                        padding: "12px 12px 12px 28px",
                        fontSize: 16,
                        fontFamily: "'JetBrains Mono', monospace",
                        fontWeight: 600,
                        outline: "none",
                        boxSizing: "border-box",
                      }}
                    />
                  </div>
                </div>
                <div style={{ flex: 1 }}>
                  <label style={{ display: "block", color: "#9ca3af", fontSize: 12, fontWeight: 500, letterSpacing: "0.04em", marginBottom: 8 }}>
                    QUANTITY
                  </label>
                  <input
                    className="pricer-input"
                    type="number"
                    inputMode="numeric"
                    placeholder="0"
                    value={qty}
                    onChange={e => setQty(e.target.value)}
                    min="1"
                    style={{
                      width: "100%",
                      background: "#0a0d12",
                      border: "1px solid #1e2330",
                      borderRadius: 8,
                      color: "#f9fafb",
                      padding: "12px 12px",
                      fontSize: 16,
                      fontFamily: "'JetBrains Mono', monospace",
                      fontWeight: 600,
                      outline: "none",
                      boxSizing: "border-box",
                    }}
                  />
                </div>
              </div>

              {/* Imprint Locations */}
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
                  <span style={{ color: "#9ca3af", fontSize: 12, fontWeight: 500, letterSpacing: "0.04em" }}>
                    IMPRINT LOCATIONS ({locations.length}/4)
                  </span>
                  {locations.length < 4 && (
                    <button onClick={addLocation} className="pricer-add-btn" style={{
                      background: "none",
                      border: "1px dashed #2a3a5c",
                      borderRadius: 8,
                      color: "#3b82f6",
                      fontSize: 12,
                      fontWeight: 600,
                      padding: "8px 16px",
                      cursor: "pointer",
                      fontFamily: "'DM Sans', sans-serif",
                      transition: "all 0.15s",
                    }}
                      onMouseEnter={e => { e.target.style.borderColor = "#3b82f6"; e.target.style.background = "#0c1629"; }}
                      onMouseLeave={e => { e.target.style.borderColor = "#2a3a5c"; e.target.style.background = "none"; }}
                    >
                      + Add Location
                    </button>
                  )}
                </div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {locations.map((loc, i) => (
                    <LocationCard
                      key={i}
                      index={i}
                      location={loc}
                      onChange={val => updateLocation(i, val)}
                      onRemove={() => removeLocation(i)}
                      qty={parseInt(qty) || 1}
                    />
                  ))}
                </div>
              </div>
            </div>

            {/* RIGHT: Results */}
            <div className="pricer-results">
              {pricing ? (
                <div style={{
                  background: "linear-gradient(160deg, #111827 0%, #0a0d14 60%, #0c1222 100%)",
                  border: "1px solid #1e2330",
                  borderRadius: 20,
                  padding: 28,
                  overflow: "hidden",
                  position: "relative",
                }}>
                  <div style={{
                    position: "absolute", top: -60, right: -60, width: 200, height: 200,
                    background: "radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%)",
                    pointerEvents: "none",
                  }} />

                  <div style={{
                    fontSize: 12, fontWeight: 600, color: "#6b7280", letterSpacing: "0.08em",
                    marginBottom: 20, fontFamily: "'JetBrains Mono', monospace",
                  }}>
                    PRICE SUMMARY
                  </div>

                  {/* Big price */}
                  <div style={{ textAlign: "center", padding: "20px 0 28px", borderBottom: "1px solid #1e2330" }}>
                    <div style={{ color: "#6b7280", fontSize: 12, fontWeight: 500, marginBottom: 4 }}>Per Unit Price</div>
                    <div style={{
                      fontSize: 48, fontWeight: 700, fontFamily: "'JetBrains Mono', monospace",
                      background: "linear-gradient(135deg, #60a5fa, #34d399)",
                      WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent",
                      letterSpacing: "-0.03em", lineHeight: 1.1,
                    }}>
                      {formatCurrency(pricing.unitPrice)}
                    </div>
                    <div style={{ color: "#4b5563", fontSize: 12, marginTop: 6, fontFamily: "'JetBrains Mono', monospace" }}>
                      {pricing.tierLabel}
                    </div>
                  </div>

                  {/* Total */}
                  <div style={{
                    display: "flex", justifyContent: "space-between", alignItems: "baseline",
                    padding: "18px 0", borderBottom: "1px solid #1e2330",
                  }}>
                    <span style={{ color: "#9ca3af", fontSize: 14, fontWeight: 500 }}>Total ({pricing.quantity} pcs)</span>
                    <span style={{
                      fontSize: 26, fontWeight: 700, color: "#f9fafb", fontFamily: "'JetBrains Mono', monospace",
                    }}>
                      {formatCurrency(pricing.totalPrice)}
                    </span>
                  </div>

                  {/* Breakdown */}
                  <div style={{ paddingTop: 18 }}>
                    <div style={{
                      fontSize: 11, fontWeight: 600, color: "#4b5563", letterSpacing: "0.08em",
                      marginBottom: 14, fontFamily: "'JetBrains Mono', monospace",
                    }}>
                      BREAKDOWN
                    </div>

                    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                      <div style={{
                        display: "flex", justifyContent: "space-between",
                        background: "#0a0d12", borderRadius: 10, padding: "12px 14px",
                      }}>
                        <div>
                          <div style={{ color: "#9ca3af", fontSize: 12, fontWeight: 500 }}>Product Cost</div>
                          <div style={{ color: "#6b7280", fontSize: 11, marginTop: 2 }}>
                            {pricing.storeMinApplied
                              ? `${formatCurrency(parseFloat(productPrice))} + $5.00 min markup`
                              : `${formatCurrency(parseFloat(productPrice))} × ${(pricing.markup * 100).toFixed(0)}% markup`
                            }
                          </div>
                          {pricing.storeMinApplied && (
                            <div style={{ color: "#f59e0b", fontSize: 10, marginTop: 3, fontFamily: "'JetBrains Mono', monospace" }}>
                              $5.00 min applied (markup was {formatCurrency(parseFloat(productPrice) * pricing.markup - parseFloat(productPrice))})
                            </div>
                          )}
                        </div>
                        <div style={{
                          color: "#e5e7eb", fontSize: 16, fontWeight: 600,
                          fontFamily: "'JetBrains Mono', monospace", alignSelf: "center",
                        }}>
                          {formatCurrency(pricing.markedUpProduct)}
                        </div>
                      </div>

                      {pricing.locationBreakdown.map((lb, i) => (
                        <div key={i} style={{
                          display: "flex", justifyContent: "space-between",
                          background: "#0a0d12", borderRadius: 10, padding: "12px 14px",
                        }}>
                          <div>
                            <div style={{ color: "#9ca3af", fontSize: 12, fontWeight: 500 }}>
                              {lb.isFirst ? "Primary" : `Location ${i + 1}`}
                            </div>
                            <div style={{ color: "#6b7280", fontSize: 11, marginTop: 2 }}>
                              {lb.serviceName} — {lb.label}
                            </div>
                          </div>
                          <div style={{
                            color: lb.isUnavailable ? "#ef4444" : "#34d399",
                            fontSize: 16, fontWeight: 600,
                            fontFamily: "'JetBrains Mono', monospace", alignSelf: "center",
                          }}>
                            +{formatCurrency(lb.decoPrice)}
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Formula */}
                    <div style={{
                      marginTop: 18, padding: "10px 14px", background: "#0a0d12",
                      borderRadius: 10, border: "1px dashed #1e2330",
                    }}>
                      <div style={{
                        color: "#4b5563", fontSize: 11, fontFamily: "'JetBrains Mono', monospace", lineHeight: 1.6,
                      }}>
                        <span style={{ color: "#6b7280" }}>formula:</span> {pricing.storeMinApplied ? "(product + $5.00 min)" : "(product × markup)"} + decoration costs<br />
                        <span style={{ color: "#6b7280" }}>calc:</span> {pricing.storeMinApplied
                          ? `(${formatCurrency(parseFloat(productPrice))} + $5.00)`
                          : `(${formatCurrency(parseFloat(productPrice))} × ${(pricing.markup * 100).toFixed(0)}%)`
                        } + {formatCurrency(pricing.totalDecoPerUnit)} = <span style={{ color: "#93c5fd" }}>{formatCurrency(pricing.unitPrice)}</span>
                      </div>
                    </div>
                  </div>
                </div>
              ) : (
                <div style={{
                  background: "#0f1117", border: "1px dashed #1e2330", borderRadius: 20,
                  padding: "80px 40px", textAlign: "center",
                }}>
                  <div style={{ fontSize: 40, marginBottom: 16, opacity: 0.3 }}>📊</div>
                  <div style={{ color: "#4b5563", fontSize: 15, fontWeight: 500 }}>
                    Enter product cost and quantity<br />to generate pricing
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<AutoPricer />);
</script></body></html>
